# ControlFinan in Rails 8 + Hotwire (this repo) x Django x Laravel (Octane) x Go x Java x Rust x C#, all in production mode with the same limits and the same data.
# Run with ./benchmark/run.sh (it reads the Rails master key from the Rails repo; nothing secret is stored here).
x-db: &db
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
  cpus: 2
  mem_limit: 1g
  tmpfs: /var/lib/postgresql/data

services:
  rails-db:
    <<: *db
  django-db:
    <<: *db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_django
  laravel-db:
    <<: *db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_laravel
  go-db:
    <<: *db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_go
  java-db:
    <<: *db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_java
  rust-db:
    <<: *db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_rust
  csharp-db:
    <<: *db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_csharp

  rails:
    build: ..
    image: bench-rails
    cpus: 2
    mem_limit: 1g
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      APP_DATABASE_PASSWORD: app
      DATABASE_URL: postgresql://app:app@rails-db:5432/app_production
      CACHE_DATABASE_URL: postgresql://app:app@rails-db:5432/app_production_cache
      QUEUE_DATABASE_URL: postgresql://app:app@rails-db:5432/app_production_queue
      CABLE_DATABASE_URL: postgresql://app:app@rails-db:5432/app_production_cable
      RAILS_MAX_THREADS: 5
      RAILS_LOG_LEVEL: warn
    # Puma directly (no Thruster proxy), 2 processes x 5 threads.
    command: ["bash", "-c", "./bin/rails db:prepare && exec bundle exec puma -e production -w 2 -t 5:5 -p 3000"]
    ports: ["3101:3000"]
    depends_on: [rails-db]

  django:
    build:
      context: ${DJANGO_APP:-../../controlfinan-django}
      dockerfile: Dockerfile.prod
    image: bench-django
    cpus: 2
    mem_limit: 1g
    environment:
      DJANGO_SECRET_KEY: benchmark-only-secret
      DATABASE_URL: postgresql://app:app@django-db:5432/controlfinan_django
      BCRYPT_COST: 12
      WEB_CONCURRENCY: 2
      THREADS: 5
    ports: ["8101:8000"]
    depends_on: [django-db]

  laravel:
    build:
      context: ${LARAVEL_APP:-../../controlfinan-laravel}
      dockerfile: Dockerfile.prod
    image: bench-laravel
    cpus: 2
    mem_limit: 1g
    environment:
      APP_KEY: base64:qjPCQP/5F4TqTUFkvvR1ubtYMdxVsz/VHUulhBRStxY=  # benchmark-only key
      APP_URL: http://laravel:8000
      DB_CONNECTION: pgsql
      DB_HOST: laravel-db
      DB_DATABASE: controlfinan_laravel
      DB_USERNAME: app
      DB_PASSWORD: app
      BCRYPT_ROUNDS: 12
      # Octane keeps the app in memory, like Puma and Gunicorn. One worker per CPU (Octane's default): Puma and
      # Gunicorn run 2 processes x 5 threads, but the GVL/GIL lets only 2 requests use the CPU at a time;
      # 10 PHP workers on 2 CPUs were 4x slower (CPU throttling, see README).
      OCTANE_WORKERS: 2
    ports: ["8102:8000"]
    depends_on: [laravel-db]

  go:
    build:
      context: ${GO_APP:-../../controlfinan-go}
      dockerfile: Dockerfile.prod
    image: bench-go
    cpus: 2
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://app:app@go-db:5432/controlfinan_go
      SECRET_KEY_BASE: benchmark-only-secret
      BCRYPT_COST: 12
      # Up to 10 database connections, like the 10 threads of Puma and Gunicorn. Go runs goroutines on
      # GOMAXPROCS threads, which Go 1.25 sets from the container CPU limit (2).
      DB_POOL: 10
    ports: ["8104:8000"]
    depends_on: [go-db]

  java:
    build:
      context: ${JAVA_APP:-../../controlfinan-java}
      dockerfile: Dockerfile.prod
    image: bench-java
    cpus: 2
    mem_limit: 1g
    environment:
      DATABASE_URL: jdbc:postgresql://java-db:5432/controlfinan_java
      SECRET_KEY_BASE: benchmark-only-secret
      BCRYPT_COST: 12
      LOG_LEVEL: warn
      # Tomcat's default thread pool and up to 10 database connections (HikariCP), like the 10 threads of Puma and Gunicorn.
      DB_POOL: 10
    ports: ["8105:8000"]
    depends_on: [java-db]

  rust:
    build:
      context: ${RUST_APP:-../../controlfinan-rust}
      dockerfile: Dockerfile.prod
    image: bench-rust
    cpus: 2
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://app:app@rust-db:5432/controlfinan_rust
      SECRET_KEY_BASE: benchmark-only-secret
      BCRYPT_COST: 12
      # Tokio uses one worker thread per CPU of the container; up to 10 database connections, like the others.
      DB_POOL: 10
    ports: ["8106:8000"]
    depends_on: [rust-db]

  csharp:
    build:
      context: ${CSHARP_APP:-../../controlfinan-csharp}
      dockerfile: Dockerfile.prod
    image: bench-csharp
    cpus: 2
    mem_limit: 1g
    environment:
      DATABASE_URL: Host=csharp-db;Database=controlfinan_csharp;Username=app;Password=app
      SECRET_KEY_BASE: benchmark-only-secret
      BCRYPT_COST: 12
      # Kestrel with the default thread pool; up to 10 database connections (Npgsql pool), like the others.
      DB_POOL: 10
    ports: ["8107:8000"]
    depends_on: [csharp-db]

  k6:
    image: grafana/k6:0.54.0
    profiles: ["tools"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
